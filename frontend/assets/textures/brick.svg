<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Brick block that bombs can destroy -->
  <defs>
    <clipPath id="round">
      <rect x="1" y="1" width="38" height="38" rx="7"/>
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="40" height="40" fill="#5e2814"/>
    <g fill="#c4612d">
      <rect x="1" y="2" width="18" height="11" rx="2"/>
      <rect x="21" y="2" width="18" height="11" rx="2"/>
      <rect x="-8" y="15" width="17" height="11" rx="2"/>
      <rect x="11" y="15" width="18" height="11" rx="2"/>
      <rect x="31" y="15" width="17" height="11" rx="2"/>
      <rect x="1" y="28" width="18" height="11" rx="2"/>
      <rect x="21" y="28" width="18" height="11" rx="2"/>
    </g>
    <g fill="#e8925a">
      <rect x="1" y="2" width="18" height="2.5" rx="1"/>
      <rect x="21" y="2" width="18" height="2.5" rx="1"/>
      <rect x="-8" y="15" width="17" height="2.5" rx="1"/>
      <rect x="11" y="15" width="18" height="2.5" rx="1"/>
      <rect x="31" y="15" width="17" height="2.5" rx="1"/>
      <rect x="1" y="28" width="18" height="2.5" rx="1"/>
      <rect x="21" y="28" width="18" height="2.5" rx="1"/>
    </g>
    <rect y="36" width="40" height="4" fill="#3d1a0c" opacity="0.5"/>
  </g>
</svg>
